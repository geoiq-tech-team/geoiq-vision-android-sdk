[versions]
# Build tooling
# Kotlin 2.x uses the Compose Compiler Gradle plugin (org.jetbrains.kotlin.plugin.compose),
# which is versioned in lockstep with Kotlin — there is no separate composeCompiler version
# and `composeOptions.kotlinCompilerExtensionVersion` no longer applies.
agp = "8.11.1"
kotlin = "2.2.21"

# Android SDK levels — both modules must agree.
# compileSdk 36 is required by androidx.navigation3.
compileSdk = "36"
minSdk = "23"
targetSdk = "36"

# AndroidX / Google
# Ceilings are set by AGP 8.11.1 + compileSdk 36 (checked via each artifact's
# aar-metadata.properties): core-ktx 1.19.0 and activity-compose 1.13.0 both
# require AGP 9.1, so they are deliberately NOT used.
coreKtx = "1.18.0"          # minCompileSdk 36, minAgp 8.9.1
appcompat = "1.7.1"
material = "1.13.0"
lifecycle = "2.10.0"        # matches navigation3 1.1.4's lifecycle-runtime floor
activityCompose = "1.12.4"  # minCompileSdk 36, minAgp 8.9.1
composeBom = "2026.01.00"   # -> Compose 1.10.1, satisfies navigation3's 1.10.0 floor

# Navigation 3 — back stack is owned by the caller; NavDisplay replaces NavHost.
# Requires compileSdk 36+ and the Kotlin serialization plugin (NavKey is @Serializable).
navigation3 = "1.1.4"
kotlinxSerialization = "1.11.0"

livekit = "2.23.5"
livekitComposeComponents = "2.2.0"

# GeoIQ Vision SDK — versions of the published artifact used by the sample app.
# `geoiqVisionSdkSnapshot` is a JitPack branch snapshot: "<branch with / as ~>-SNAPSHOT" eg: master-SNAPSHOT
geoiqVisionSdkRelease = "v1.0.7"
geoiqVisionSdkSnapshot = "siva~refactor-SNAPSHOT"

# Test
junit = "4.13.2"
junitExt = "1.1.5"
espresso = "3.5.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
android-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# Compose — versions come from the BOM, so these declare no version of their own
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# Navigation 3 — lifecycle-viewmodel-navigation3 provides NavEntry-scoped ViewModels.
# It is NOT used here: MainViewModel stays activity-scoped so a live LiveKit session
# survives navigation (see MainActivity / VisionBotSDKManager being a process singleton).
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "kotlinxSerialization" }

livekit-android = { group = "io.livekit", name = "livekit-android", version.ref = "livekit" }
livekit-android-compose-components = { group = "io.livekit", name = "livekit-android-compose-components", version.ref = "livekitComposeComponents" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitExt" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
# Required on Kotlin 2.x for any module with Compose code — replaces kotlinCompilerExtensionVersion.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Required by Navigation 3: NavKey implementations are @Serializable.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
